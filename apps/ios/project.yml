name: MightyZiWei
options:
  bundleIdPrefix: dev.narumi
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  developmentLanguage: zh-Hant
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: A4YQL6FFTK
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.4"
    CURRENT_PROJECT_VERSION: "3"
    ENABLE_USER_SCRIPT_SANDBOXING: true
    SWIFT_STRICT_CONCURRENCY: complete
    LOCALIZATION_PREFERS_STRING_CATALOGS: true
    STRING_CATALOG_GENERATE_SYMBOLS: true
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  MightyZiWei:
    type: application
    platform: iOS
    sources:
      - path: MightyZiWei
    resources:
      - path: MightyZiWei/Resources
    dependencies:
      - target: MightyZiWeiPrivacyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumi.MightyZiWei
        PRODUCT_NAME: MightyZiWei
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Configuration/MightyZiWei-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/MightyZiWei.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  MightyZiWeiPrivacyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MightyZiWeiPrivacyWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumi.MightyZiWei.PrivacyWidget
        PRODUCT_NAME: 隱私回顧
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: Configuration/MightyZiWeiPrivacyWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: Configuration/MightyZiWeiPrivacyWidget.entitlements
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
        TARGETED_DEVICE_FAMILY: "1"
  MightyZiWeiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MightyZiWeiTests
    resources:
      - path: MightyZiWeiTests/Fixtures
        optional: true
    dependencies:
      - target: MightyZiWei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumi.MightyZiWeiTests
        GENERATE_INFOPLIST_FILE: true
  MightyZiWeiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MightyZiWeiUITests
    dependencies:
      - target: MightyZiWei
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.narumi.MightyZiWeiUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  MightyZiWei:
    build:
      targets:
        MightyZiWei: all
        MightyZiWeiTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - MightyZiWeiTests
        - MightyZiWeiUITests
